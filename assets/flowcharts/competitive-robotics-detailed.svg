#071421" stroke="#0aff64" stroke-width="2"/><circle cx="1217.0" cy="195.0" r="17" fill="#0aff64"/><text x="1217.0" y="201.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">4</text><text x="1368.5" y="215.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Command parsing</text><text x="1368.5" y="261.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Convert operator commands to</text><text x="1368.5" y="280.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">actions</text></g><g filter="url(#shadow)"><rect x="1192.0" y="348.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#0aff64" stroke-width="2"/><circle cx="1217.0" cy="373.0" r="17" fill="#0aff64"/><text x="1217.0" y="379.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">5</text><text x="1368.5" y="393.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Task state machine</text><text x="1368.5" y="439.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Sequence mechanisms and timed</text><text x="1368.5" y="458.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">actions</text></g><g filter="url(#shadow)"><rect x="813.0" y="348.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#0aff64" stroke-width="2"/><circle cx="838.0" cy="373.0" r="17" fill="#0aff64"/><text x="838.0" y="379.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">6</text><text x="989.5" y="393.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Safety / interlocks</text><text x="989.5" y="439.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Prevent invalid or conflicting</text><text x="989.5" y="458.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">actions</text></g><g filter="url(#shadow)"><rect x="434.0" y="348.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#0aff64" stroke-width="2"/><circle cx="459.0" cy="373.0" r="17" fill="#0aff64"/><text x="459.0" y="379.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">7</text><text x="610.5" y="393.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Arduino controller</text><text x="610.5" y="439.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Receive low-level actuation targets</text></g><g filter="url(#shadow)"><rect x="55.0" y="348.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#0aff64" stroke-width="2"/><circle cx="80.0" cy="373.0" r="17" fill="#0aff64"/><text x="80.0" y="379.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">8</text><text x="231.5" y="393.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Motor / servo drive</text><text x="231.5" y="439.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Generate PWM/direction outputs</text></g><g filter="url(#shadow)"><rect x="55.0" y="526.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#0aff64" stroke-width="2"/><circle cx="80.0" cy="551.0" r="17" fill="#0aff64"/><text x="80.0" y="557.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">9</text><text x="231.5" y="571.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Mechanisms</text><text x="231.5" y="617.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Drive, manipulate, grip or launch</text></g><g filter="url(#shadow)"><rect x="434.0" y="526.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#0aff64" stroke-width="2"/><circle cx="459.0" cy="551.0" r="17" fill="#0aff64"/><text x="459.0" y="557.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">10</text><text x="610.5" y="571.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Feedback sensing</text><text x="610.5" y="617.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Use available position/IMU/limit</text><text x="610.5" y="636.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">feedback</text></g><g filter="url(#shadow)"><rect x="813.0" y="526.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#0aff64" stroke-width="2"/><circle cx="838.0" cy="551.0" r="17" fill="#0aff64"/><text x="838.0" y="557.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">11</text><text x="989.5" y="571.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">PID + tuning</text><text x="989.5" y="617.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Improve repeatability and stability</text></g><g filter="url(#shadow)"><rect x="1192.0" y="526.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#0aff64" stroke-width="2"/><circle cx="1217.0" cy="551.0" r="17" fill="#0aff64"/><text x="1217.0" y="557.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">12</text><text x="1368.5" y="571.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Iterative test loop</text><text x="1368.5" y="617.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size