="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Understand rules, target and time</text><text x="231.5" y="280.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">limits</text></g><g filter="url(#shadow)"><rect x="434.0" y="170.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#facc15" stroke-width="2"/><circle cx="459.0" cy="195.0" r="17" fill="#facc15"/><text x="459.0" y="201.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">2</text><text x="610.5" y="215.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Camera observation</text><text x="610.5" y="261.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Acquire scene frames</text></g><g filter="url(#shadow)"><rect x="813.0" y="170.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#facc15" stroke-width="2"/><circle cx="838.0" cy="195.0" r="17" fill="#facc15"/><text x="838.0" y="201.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">3</text><text x="989.5" y="215.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Target detection</text><text x="989.5" y="261.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Identify moving/desired target</text></g><g filter="url(#shadow)"><rect x="1192.0" y="170.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#facc15" stroke-width="2"/><circle cx="1217.0" cy="195.0" r="17" fill="#facc15"/><text x="1217.0" y="201.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">4</text><text x="1368.5" y="215.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Target tracking</text><text x="1368.5" y="261.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Estimate target position over time</text></g><g filter="url(#shadow)"><rect x="1192.0" y="348.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#facc15" stroke-width="2"/><circle cx="1217.0" cy="373.0" r="17" fill="#facc15"/><text x="1217.0" y="379.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">5</text><text x="1368.5" y="393.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Scene geometry</text><text x="1368.5" y="439.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Relate pixels to spatial position</text></g><g filter="url(#shadow)"><rect x="813.0" y="348.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#facc15" stroke-width="2"/><circle cx="838.0" cy="373.0" r="17" fill="#facc15"/><text x="838.0" y="379.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">6</text><text x="989.5" y="393.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Coordinate transform</text><text x="989.5" y="439.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Camera frame → robot/task frame</text></g><g filter="url(#shadow)"><rect x="434.0" y="348.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#facc15" stroke-width="2"/><circle cx="459.0" cy="373.0" r="17" fill="#facc15"/><text x="459.0" y="379.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">7</text><text x="610.5" y="393.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Strategy selection</text><text x="610.5" y="439.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Choose trajectory/timing/speed</text><text x="610.5" y="458.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">approach</text></g><g filter="url(#shadow)"><rect x="55.0" y="348.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#facc15" stroke-width="2"/><circle cx="80.0" cy="373.0" r="17" fill="#facc15"/><text x="80.0" y="379.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">8</text><text x="231.5" y="393.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Robot command / IK</text><text x="231.5" y="439.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Map target action to robot joints</text></g><g filter="url(#shadow)"><rect x="55.0" y="526.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#facc15" stroke-width="2"/><circle cx="80.0" cy="551.0" r="17" fill="#facc15"/><text x="80.0" y="557.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">9</text><text x="231.5" y="571.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Throw execution</text><text x="231.5" y="617.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Execute arm release motion</text></g><g filter="url(#shadow)"><rect x="434.0" y="526.0" width="353.0" height="150.0" rx="18" fill="#071421" stroke="#facc15" stroke-width="2"/><circle cx="459.0" cy="551.0" r="17" fill="#facc15"/><text x="459.0" y="557.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">10</text><text x="610.5" y="571.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Outcome observation</text><text x="610.5" y="617.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Measure hit/miss/landing behavior</text></g><g