ke="#e879f9" stroke-width="2"/><circle cx="1217.0" cy="195.0" r="17" fill="#e879f9"/><text x="1217.0" y="201.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">4</text><text x="1368.5" y="215.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Observation capture</text><text x="1368.5" y="261.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Collect image/state/gripper context</text></g><g filter="url(#shadow)"><rect x="1192.0" y="337.0" width="353.0" height="139.0" rx="18" fill="#071421" stroke="#e879f9" stroke-width="2"/><circle cx="1217.0" cy="362.0" r="17" fill="#e879f9"/><text x="1217.0" y="368.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">5</text><text x="1368.5" y="382.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Prompt / instruction</text><text x="1368.5" y="428.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Define common task description</text></g><g filter="url(#shadow)"><rect x="813.0" y="337.0" width="353.0" height="139.0" rx="18" fill="#071421" stroke="#e879f9" stroke-width="2"/><circle cx="838.0" cy="362.0" r="17" fill="#e879f9"/><text x="838.0" y="368.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">6</text><text x="989.5" y="382.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Deterministic baseline</text><text x="989.5" y="428.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Establish non-learning reference</text></g><g filter="url(#shadow)"><rect x="434.0" y="337.0" width="353.0" height="139.0" rx="18" fill="#071421" stroke="#e879f9" stroke-width="2"/><circle cx="459.0" cy="362.0" r="17" fill="#e879f9"/><text x="459.0" y="368.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">7</text><text x="610.5" y="382.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Zero-shot branch</text><text x="610.5" y="428.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Instruction only, no examples</text></g><g filter="url(#shadow)"><rect x="55.0" y="337.0" width="353.0" height="139.0" rx="18" fill="#071421" stroke="#e879f9" stroke-width="2"/><circle cx="80.0" cy="362.0" r="17" fill="#e879f9"/><text x="80.0" y="368.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">8</text><text x="231.5" y="382.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">Few-shot branch</text><text x="231.5" y="428.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Condition with a few demonstrations</text></g><g filter="url(#shadow)"><rect x="55.0" y="504.0" width="353.0" height="139.0" rx="18" fill="#071421" stroke="#e879f9" stroke-width="2"/><circle cx="80.0" cy="529.0" r="17" fill="#e879f9"/><text x="80.0" y="535.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">9</text><text x="231.5" y="549.0" text-anchor="middle" fill="#f8fafc" font-family="Rajdhani,Arial,sans-serif" font-size="19" font-weight="700">In-context branch</text><text x="231.5" y="595.0" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Condition with richer task context</text></g><g filter="url(#shadow)"><rect x="434.0" y="504.0" width="353.0" height="139.0" rx="18" fill="#071421" stroke="#e879f9" stroke-width="2"/><circle cx="459.0" cy="529.0" r="17" fill="#e879f9"/><text x="459.0" y="535.0" text-anchor="middle" fill="#020617" font-family="monospace" font-size="14" font-weight="900">10</text><text x