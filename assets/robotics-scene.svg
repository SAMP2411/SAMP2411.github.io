<path d="m186 393 29-17 33 19v21l-30 17-32-19Z" fill="#213c49" stroke="#6b929f"/>
<path d="m186 393 32 18 30-16-33-19Z" fill="#77939e"/>
<path d="m218 411 30-16v21l-30 17Z" fill="#305564"/>
<path d="m194 414 8 5v9l-8-5Zm38 5 8-5v9l-8 5Z" fill="#08141d" stroke="#58717e"/>
<path d="M208 387v-9h17v9" fill="#1c323f" stroke="#8caab4"/>
<ellipse cx="216.5" cy="378" rx="8.5" ry="4" fill="#71d1d5"/>
<path d="m224 414 15-8" stroke="#66dfdb" stroke-width="3"/>
</g>
<!-- Annotation lines do not imply live metrics. -->
<g fill="none" stroke="#658591" stroke-width=".8"><path d="M350 204H251l-22-17H123"/><path d="m412 354 48 36h123"/><path d="m191 430-32 23H97"/></g>
<g font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.2" fill="#a6c1ca"><text x="123" y="177">MANIPULATION</text><text x="473" y="408">REFERENCE FRAMES</text><text x="97" y="474">MOBILE AUTONOMY</text></g>
<g stroke-width="2" fill="none"><path d="M110 345v-38" stroke="#65cdd1"/><path d="m110 345 31 18" stroke="#da9363"/><path d="m110 345-26 16" stroke="#8da6b2"/></g>
<g font-family="ui-monospace, monospace" font-size="10" fill="#8eabb6"><text x="107" y="298">Z</text><text x="146" y="370">X</text><text x="74" y="370">Y</text></g>
</svg>
