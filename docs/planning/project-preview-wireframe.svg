<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img"><title>Project preview interaction: desktop drawer and mobile full-screen view</title><rect width="100%" height="100%" fill="#f5f5f3"/><text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#22282a">PROJECT PREVIEW · CONTENT AND INTERACTION SPECIFICATION</text><rect x="24" y="58" width="780" height="850" rx="8" fill="#e6e7e5" stroke="#c4c7c7"/><text x="45" y="92" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#22282a">Project grid remains behind the preview</text><rect x="292" y="58" width="512" height="850" rx="8" fill="#fff" stroke="#c4c7c7"/><text x="320" y="96" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#22282a">Project preview</text><text x="742" y="96" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#22282a">Close ×</text><text x="320" y="141" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#22282a">TurtleBot3 Navigation</text><text x="320" y="174" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#22282a">Academic project · Simulation and hardware</text><rect x="320" y="199" width="456" height="230" rx="8" fill="#e8e9e6" stroke="#c4c7c7"/><path d="M328 314.0h440" stroke="#c4c7c7"/><text x="328" y="307.0" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#737a7b">MEDIA</text><text x="320" y="451" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#22282a">Project image + provenance caption</text><text x="320" y="489" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#22282a">Problem</text><text x="320" y="514" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#555d60">Map an environment and execute repeatable</text><text x="320" y="533" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#555d60">waypoint navigation.</text><text x="320" y="589" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#22282a">My contribution</text><text x="320" y="614" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#555d60">ROS2 integration, localization, planner tuning and</text><text x="320" y="633" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#555d60">TF/odometry debugging.</text><text x="320" y="689" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#22282a">Validation</text><text x="320" y="714" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#555d60">Explain the scenarios tested and distinguish</text><text x="320" y="733" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#555d60">simulation from hardware evidence.</text><rect x="320" y="803" width="160" height="40" rx="8" fill="#293238" stroke="#c4c7c7"/><text x="332" y="828" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Full case study →</text><rect x="492" y="803" width="132" height="40" rx="8" fill="#fff" stroke="#c4c7c7"/><text x="504" y="828" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#293238">Source code ↗</text><rect x="856" y="58" width="390" height="850" rx="8" fill="#fff" stroke="#c4c7c7"/><text x="876" y="97" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#22282a">← Back to projects</text><text x="876" y="143" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#22282a">TurtleBot3 Navigation</text><text x="876" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#555d60">Academic project · Simulation and</text><text x="876" y="192" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#555d60">hardware</text><rect x="876" y="217" width="350" height="197" rx="8" fill="#e8e9e6" stroke="#c4c7c7"/><path d="M884 315.5h334" stroke="#c4c7c7"/><text x="884" y="308.5" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#737a7b">MEDIA</text><text x="876" y="438" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#22282a">Image provenance</text><text x="876" y="482" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#555d60">Same preview content, in a</text><text x="876" y="504" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#555d60">full-screen mobile panel.</text><text x="876" y="567" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#555d60">Close or browser Back restores the</text><text x="876" y="587" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#555d60">selected filter and original scroll</text><text x="876" y="607" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#555d60">position.</text><text x="876" y="670" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#555d60">Keyboard: focus enters the panel,</text><text x="876" y="690" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#555d60">Escape closes it, focus returns to the</text><text x="876" y="710" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#555d60">original project.</text><rect x="876" y="805" width="160" height="40" rx="8" fill="#293238" stroke="#c4c7c7"/><text x="888" y="830" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Full case study →</text><text x="28" y="940" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#22282a">Without JavaScript, View project opens the full case study. No nested modal; no automatic motion.</text></svg>