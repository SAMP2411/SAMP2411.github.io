name: Patch homepage with expanded projects

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-homepage.yml'
      - 'homepage-expanded-projects.html'
      - 'favicon.svg'
      - 'site.webmanifest'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          title = '<title>Samarth Patel | Creative Robotics Engineer</title>'
          favicon_meta = (
              title + '\n'
              '    <link rel="icon" href="favicon.svg" type="image/svg+xml">\n'
              '    <link rel="shortcut icon" href="favicon.svg" type="image/svg+xml">\n'
              '    <link rel="manifest" href="site.webmanifest">\n'
              '    <meta name="theme-color" content="#02040a">'
          )

          if 'rel="icon" href="favicon.svg"' not in text:
              if title not in text:
                  raise SystemExit('Page title marker not found')
              text = text.replace(title, favicon_meta, 1)

          if 'id="expanded-projects-home"' not in text:
              marker = '    <!-- Contact Section (SECURE TERMINAL) -->'
              if marker not in text:
                  raise SystemExit('Contact-section marker not found')
              section = Path('homepage-expanded-projects.html').read_text(encoding='utf-8')
              text = text.replace(marker, section + '\n\n' + marker, 1)

          index.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No homepage changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate expanded projects into homepage"
          git push
