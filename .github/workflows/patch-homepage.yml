name: Portfolio validation
on:
  push:
    branches: [main, 'redesign/**']
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Audit original image dimensions
        run: |
          python - <<'PY'
          import json, pathlib
          from PIL import Image
          result=[]
          for p in pathlib.Path('.').rglob('*'):
            if p.suffix.lower() in ['.jpg','.jpeg','.png','.webp','.avif']:
              with Image.open(p) as im:
                im.load()
                result.append(dict(path=str(p),width=im.width,height=im.height,format=im.format,bytes=p.stat().st_size))
          pathlib.Path('image-audit.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: repository-assets-audit
          path: |
            assets
            profile.jpg
            project2.jpg
            project4.jpg
            image-audit.json
