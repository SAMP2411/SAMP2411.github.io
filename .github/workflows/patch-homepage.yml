name: Refresh portfolio projects, experience and skills

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-homepage.yml'
      - 'scripts/build_project_pages.py'
      - 'scripts/apply_ai_assets.py'
      - 'scripts/upscale_photoreal_assets.py'
      - 'scripts/apply_photoreal_hd.py'
      - 'scripts/add_industrial_platform_projects.py'
      - 'scripts/apply_new_project_card_art.py'
      - 'project-detail.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image enhancement dependencies
        run: python -m pip install --disable-pip-version-check pillow opencv-contrib-python-headless

      - name: Build portfolio
        run: |
          python scripts/upscale_photoreal_assets.py
          python scripts/build_project_pages.py
          python scripts/apply_ai_assets.py
          python scripts/apply_photoreal_hd.py
          python scripts/add_industrial_platform_projects.py
          python scripts/apply_new_project_card_art.py

      - name: Commit generated portfolio updates
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard project/ experience/ assets/ai/ assets/project/)" ]; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html project/ experience/ project-detail.css assets/ai/*-photo-hd.webp assets/project/
          git commit -m "Apply HD illustrations to industrial project cards"
          git push
