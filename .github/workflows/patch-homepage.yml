name: Build compact project cards and detail pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-homepage.yml'
      - 'scripts/build_project_pages.py'
      - 'project-detail.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-project-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate project pages and patch Featured Protocols
        run: python scripts/build_project_pages.py

      - name: Commit generated portfolio pages
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard project/)" ]; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html project/
          git commit -m "Add compact clickable project cards and detailed pages"
          git push
