name: Merge project cards into homepage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-homepage.yml'
      - 'project-cards-extra.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge project cards into existing grid
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          # Remove the previously-added standalone archive section entirely.
          start_marker = '<!-- Expanded Portfolio Projects -->'
          end_marker = '    <!-- Contact Section (SECURE TERMINAL) -->'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + text[end:]

          # Add the new cards inside the original Projects Section grid.
          card_marker = '<!-- Project 5: TurtleBot3 -->'
          if card_marker not in text:
              section_start = text.index('    <!-- Projects Section -->')
              section_end = text.index('    <!-- Contact Section (SECURE TERMINAL) -->', section_start)
              project_section = text[section_start:section_end]

              closing = '            </div>\n        </div>\n    </section>'
              pos = project_section.rfind(closing)
              if pos == -1:
                  raise SystemExit('Original projects grid closing marker not found')

              cards = Path('project-cards-extra.html').read_text(encoding='utf-8').rstrip() + '\n\n'
              project_section = project_section[:pos] + cards + project_section[pos:]
              text = text[:section_start] + project_section + text[section_end:]

          index.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage card integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No homepage changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Merge new projects into Featured Protocols cards"
          git push
