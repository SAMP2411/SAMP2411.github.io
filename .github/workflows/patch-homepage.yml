name: Portfolio validation
on:
  push:
    branches: [main, 'redesign/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate generated site
        run: |
          python scripts/build_site.py
          python scripts/validate_site.py
          git diff --exit-code -- '*.html' sitemap.xml robots.txt
      - name: Install development-only QA tools
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Browser regression and accessibility
        run: |
          python -m http.server 8000 > /tmp/portfolio-server.log 2>&1 &
          node scripts/browser-test.mjs
      - name: Upload verification report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-qa
          path: qa-output/
          retention-days: 14
